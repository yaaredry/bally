services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: bally
      POSTGRES_USER: bally
      POSTGRES_PASSWORD: bally_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bally -d bally"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: dev
    environment:
      DATABASE_URL: postgresql://bally:bally_dev@db:5432/bally
      JWT_SECRET: dev_jwt_secret_replace_in_prod
      PORT: 3001
      NODE_ENV: development
      CLIENT_URL: http://localhost:5173
    ports:
      - "3001:3001"
    volumes:
      - ./server/src:/app/src
      - ./server/db:/app/db
      - ./node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  # client runs natively on the host (avoids rollup native binary mismatch on Apple Silicon)
  # Run: npm run dev --workspace=client   OR   make dev-client

volumes:
  pgdata_dev:
